<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Target size fixture - A11y Checker</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; background: #ffffff; margin: 0; line-height: 1.5; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    .row { margin: 24px 0; }
    button { font: inherit; padding: 0; border: 2px solid #1a1a1a; background: #ffffff; color: #1a1a1a; box-sizing: border-box; }
    a { color: #0b4f9c; }
    #t-30 { width: 30px; height: 30px; }
    #t-44 { width: 44px; height: 44px; }
    #t-wide { display: inline-block; width: 120px; height: 20px; line-height: 20px; }
    .tiny { width: 16px; height: 16px; margin-right: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>Target size</h1>

    <!-- 30x30: passes AA (24px), fails AAA (44px) -->
    <div class="row"><button id="t-30" type="button" aria-label="Edit">E</button></div>
    <!-- 44x44: passes both -->
    <div class="row"><button id="t-44" type="button" aria-label="Delete">D</button></div>
    <!-- 120x20 standalone link: AA spacing exception applies, AAA has none -->
    <div class="row"><a id="t-wide" href="#more">More details</a></div>
    <!-- inline link inside a sentence: exempt at both levels -->
    <p class="row">Read the <a id="t-inline" href="#terms">terms</a> before you continue.</p>
    <!-- browser-default checkbox: user-agent control, exempt at both levels -->
    <div class="row"><label><input id="t-cb" type="checkbox"> Remember me</label></div>
    <!-- two 16x16 buttons side by side: fail AA (no spacing) and AAA -->
    <div class="row"><button id="t-tiny1" class="tiny" type="button" aria-label="Previous"></button><button id="t-tiny2" class="tiny" type="button" aria-label="Next"></button></div>
  </main>
</body>
</html>
