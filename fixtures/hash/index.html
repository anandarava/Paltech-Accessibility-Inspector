<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Hash-routed app</title></head>
<body>
<!-- Site-scan fixture: a hash-routed single-page app. The HTML has no links; every page is a #/route
     of this one document, and the Leave route has a sub-menu of its own. -->
<a href="#main">Skip to content</a>
<nav id="menu" aria-label="App"></nav>
<main id="main"><h1 id="title"></h1></main>
<script>
  const route = location.hash || "#/dashboard";
  const links = [["#/dashboard", "Dashboard"], ["#/leave", "Leave"], ["#/team/", "Team"], ["#/logout", "Log out"]];
  if (route.startsWith("#/leave")) links.push(["#/leave/history", "Leave history"]);
  for (const [href, text] of links) {
    const a = document.createElement("a");
    a.href = href;
    a.textContent = text;
    document.getElementById("menu").append(a, " ");
  }
  document.getElementById("title").textContent = "Route " + route;
  document.title = "Hash-routed app: " + route;
</script>
</body>
</html>
