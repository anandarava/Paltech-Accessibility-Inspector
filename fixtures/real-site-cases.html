<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real-site cases fixture - A11y Checker</title>
  <!--
    Patterns that produced false findings on real sites (MISFIRE_REPORT.md),
    next to look-alikes that must still be reported.
  -->
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1a1a1a; background: #ffffff; margin: 0; line-height: 1.5; }
    main { max-width: 760px; margin: 0 auto; padding: 24px; }
    section { margin: 24px 0; }

    /* Chrome's default focus ring on a dark band (Stack Overflow, WordPress, Python). */
    .dark { background: #1b1b1b; padding: 12px; }
    .dark a { color: #ffffff; }

    /* gov.uk: the button text is pushed out of the button and only an icon shows. */
    #icon-search { width: 40px; height: 40px; overflow: hidden; text-indent: -5000px; white-space: nowrap; color: #c0c0c0; background: #ffffff; border: 2px solid #1a1a1a; }
    /* Text parked left of the page. */
    #offscreen { position: absolute; left: -9999px; color: #c0c0c0; }
    /* Still reported: plain low-contrast text. */
    #low { color: #c0c0c0; }

    /* Carousel: the second slide waits outside an overflow:hidden window and is shown later. */
    .slider { width: 300px; overflow: hidden; white-space: nowrap; }
    .slide { display: inline-block; width: 300px; white-space: normal; }
    #slide-two { color: #c0c0c0; }

    /* Mars: a tall image strip clipped to a short window; text below it has no image behind it. */
    .strip-window { height: 60px; overflow: hidden; position: relative; }
    .strip-window canvas { display: block; }
    .night { background: #344b6e; padding: 8px; position: relative; }
    #countdown { color: #067ab4; }
    /* Apple: a gallery slide waiting outside the window, its caption over its own image. */
    .gallery { width: 300px; overflow: hidden; white-space: nowrap; }
    .card { display: inline-block; width: 300px; height: 80px; position: relative; vertical-align: top; background: #c69851; }
    .card canvas { position: absolute; inset: 0; }
    #gallery-caption { position: absolute; left: 8px; top: 8px; margin: 0; color: #f5f5f7; }
  </style>
</head>
<body>
  <main>
    <h1>Real-site cases</h1>

    <section class="dark">
      <a id="default-ring" href="#a">Default focus ring</a>
    </section>

    <section>
      <button id="icon-search" type="button">Search this site</button>
      <span id="offscreen">Parked text</span>
      <p id="low">Low contrast text that is shown.</p>
    </section>

    <section class="slider">
      <div class="slide">First slide</div><div class="slide" id="slide-two">Second slide, shown later</div>
    </section>

    <section>
      <div class="strip-window"><canvas width="300" height="400"></canvas></div>
      <div class="night"><p id="countdown">Countdown to launch</p></div>
    </section>

    <section class="gallery">
      <div class="card"></div><div class="card"><canvas width="300" height="80"></canvas><p id="gallery-caption">Today's hits</p></div>
    </section>

    <section>
      <p id="cited">Accessibility is about people<sup><a id="cite-1" href="#n1">[1]</a></sup><sup><a id="cite-2" href="#n2">[2]</a></sup> and the web.</p>
      <ol>
        <li id="n1"><span><a id="back-1" href="#cited">^</a></span> <span>First source.</span></li>
        <li id="n2"><span><a id="back-2" href="#cited">^</a></span> <span>Second source.</span></li>
      </ol>
    </section>

    <section>
      <p>See the <a id="code-link" href="#role"><code>link</code></a> role.</p>
    </section>

    <!-- An empty frame, as ad and tracking frames are: no title, lang, h1 or main. -->
    <iframe id="empty-frame" title="Advertisement" src="real-site-empty-frame.html" width="300" height="50"></iframe>
    <!-- A frame placed above the page, as Facebook's messaging frames are. -->
    <iframe id="parked-frame" title="Messaging" src="real-site-parked-frame.html" style="position:absolute;top:-10000px;left:0" width="300" height="100"></iframe>
  </main>
</body>
</html>
